#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
# 本地开发依赖一键启动：docker compose up -d
# nacos 控制台: http://127.0.0.1:8848/nacos （默认账号 nacos/nacos）
# 端口与骨架默认配置对齐；如本机端口冲突请自行调整，并同步修改 bootstrap-dev.yml 与 config/bootstrap-mybatis.yaml
services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${databaseName}
      MYSQL_ROOT_PASSWORD: ${databasePassword}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nacos:
    image: nacos/nacos-server:v2.2.3
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

volumes:
  mysql-data:
